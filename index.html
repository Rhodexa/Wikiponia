<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6b3fa0">
  <title>Wikiponia</title>
  <link rel="icon" href="assets/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cherry+Swash:wght@400;700&family=Fredoka:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script>window.WIKIPONIA_V = "c5daf1db";</script>
  <link rel="stylesheet" href="css/style.css?v=c5daf1db">
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Wikiponia home">
        <span class="brand-mark" id="brandMark"></span>
        <span class="brand-text">Wiki<em>ponia</em></span>
      </a>
      <div class="topbar-actions">
        <button class="icon-btn" id="btnSearchTop" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
        <button class="icon-btn" id="btnTheme" aria-label="Day or night"><svg viewBox="0 0 24 24" class="ic-sun"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg><svg viewBox="0 0 24 24" class="ic-moon"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg></button>
        <button class="icon-btn" id="btnSettings" aria-label="Spellbook settings"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="m12 6.5.9 1.9 2 .3-1.5 1.4.4 2-1.8-1-1.8 1 .4-2-1.5-1.4 2-.3z"/></svg></button>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Main">
      <a href="#/" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11"/><path d="M8 20v-6h8v6"/><path d="M4 20h16"/></svg><span>Library</span></a>
      <a href="#/map" data-tab="map"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="12" cy="17" r="2.6"/><path d="M7.8 8.3 10.6 15M16.6 7.8 13.6 15M8.2 7l7.6-.8"/></svg><span>Cutie Map</span></a>
      <button id="btnScroll" data-tab="scroll"><svg viewBox="0 0 24 24"><path d="M7 4h11a2 2 0 0 1 0 4h-1v10a2 2 0 0 1-2 2H6a2 2 0 0 1 0-4h1z"/><path d="M7 8V6a2 2 0 1 0-4 0v0a2 2 0 0 0 2 2h2"/><path d="M10 10h5M10 13h5"/></svg><span>Spike's Scroll</span></button>
      <a href="#/journal" data-tab="journal"><svg viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-8-1.5v14c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-14c-3-.5-6 0-8 1.5z"/><path d="M12 6v14"/></svg><span>Journal</span></a>
    </nav>
  </div>

  <!-- search sheet -->
  <div class="search-layer" id="searchLayer" hidden>
    <div class="search-box">
      <button class="icon-btn" id="searchBack" aria-label="Close search"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
      <input id="searchInput" type="search" placeholder="Ask the librarian…" autocomplete="off" enterkeyhint="search">
    </div>
    <div class="catalog" id="catalog"></div>
  </div>

  <!-- cross-reference peek -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" aria-modal="true" role="dialog" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <!-- library travel overlay -->
  <div class="travel" id="travel" hidden aria-hidden="true">
    <div class="corridor">
      <div class="wall wall-l"></div>
      <div class="wall wall-r"></div>
      <div class="floor"></div>
      <div class="ceiling"></div>
    </div>
    <div class="travel-hud">
      <div class="travel-call" id="travelCall"></div>
      <div class="travel-status" id="travelStatus"></div>
    </div>
    <img class="travel-pony" id="travelPony" src="assets/ponies/twilight.svg" alt="">
    <div class="travel-book" id="travelBook">
      <div class="tb-pages"></div>
      <div class="tb-cover" id="travelCover"></div>
    </div>
  </div>

  <!-- spike's scroll overlay -->
  <div class="scroll-fx" id="scrollFx" hidden aria-hidden="true">
    <div class="flame"></div>
    <img class="rig-fire" id="rigFire" alt="">
    <div class="spike-rig"><img class="rig-spike" id="rigSpike" alt=""></div>
    <img class="scroll-closed" id="scrollClosed" alt="">
    <div class="parchment"><div class="parchment-text" id="scrollText"></div></div>
  </div>

  <!-- pony toast -->
  <div class="pony-toast" id="ponyToast" hidden>
    <img id="toastPony" alt="">
    <div class="bubble"><b id="toastName"></b><span id="toastText"></span></div>
  </div>

  <div id="sparkles" aria-hidden="true"></div>

  <script src="assets/art/manifest.js?v=c5daf1db"></script>
  <script src="js/sound.js?v=c5daf1db"></script>
  <script src="js/marks.js?v=c5daf1db"></script>
  <script src="js/ponify.js?v=c5daf1db"></script>
  <script src="js/ponies.js?v=c5daf1db"></script>
  <script src="js/wiki.js?v=c5daf1db"></script>
  <script src="js/map.js?v=c5daf1db"></script>
  <script src="js/app.js?v=c5daf1db"></script>
</body>
</html>
